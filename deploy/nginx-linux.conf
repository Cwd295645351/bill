# 记账系统 Nginx 配置（Linux 版）
# 本地 deploy/nginx-linux.conf → 服务器 ~/bill/nginx-linux.conf
# 再复制到 /etc/nginx/conf.d/bill.conf 后：sudo nginx -t && sudo systemctl reload nginx
#
# History 模式：PC 深链刷新依赖 root + try_files 回落 /pc/index.html（勿对 /pc/ 使用 alias）。

upstream bill_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     ../ssl/localhost.pem;
    ssl_certificate_key ../ssl/localhost.key;
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 200m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1k;

    # Mobile H5 (mobile-h5/dist -> /var/www/bill/mobile/)
    location /mobile/ {
        alias /var/www/bill/mobile/;
        try_files $uri $uri/ /mobile/index.html;
    }

    location = /mobile {
        return 301 /mobile/;
    }

    # PC 端（History）
    # 静态文件目录应为 /var/www/bill/pc/（即 root=/var/www/bill 时 URI /pc/xxx → /var/www/bill/pc/xxx）
    location /pc/ {
        root /var/www/bill;
        try_files $uri $uri/ /pc/index.html;
    }

    location = /pc {
        return 301 /pc/;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://bill_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

}
