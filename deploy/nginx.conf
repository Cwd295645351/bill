# 记账系统 Nginx 配置（Windows 版）
#
# 适用目录结构（与官方 Windows 包一致）：
#   nginx/
#   ├── conf/nginx.conf    ← 在 http {} 内增加：include bill.conf;
#   ├── html/
#   │   └── bill/
#   │       ├── pc/        ← frontend/dist 内容
#   │       └── mobile/    ← mobile/dist 内容
#   ├── logs/
#   └── nginx.exe
#
# 使用方式：
#   1. 将本文件复制到 nginx/conf/bill.conf
#   2. 编辑 conf/nginx.conf，在 http { } 末尾添加：include bill.conf;
#   3. 在 nginx 安装目录执行：nginx.exe -t && nginx.exe -s reload

upstream bill_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # 路径相对于 nginx.exe 所在目录（安装根目录）
    root html/bill/pc;
    index index.html;

    client_max_body_size 200m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1k;

    # 兼容旧地址：/pc -> /
    location = /pc {
        return 301 /;
    }

    # PC 端
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 移动端 H5
    location /mobile/ {
        alias html/bill/mobile/;
        try_files $uri $uri/ /mobile/index.html;
    }

    location = /mobile {
        return 301 /mobile/;
    }

    # 后端 API（前端 VITE_BASEURL="" 时走同源 /api）
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://bill_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 上传文件静态访问（二选一，见 deploy/README.md）
  # 方案 A：复制/映射到 nginx/html/uploads/
    location /uploads/ {
        alias html/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }
  # 方案 B：直接指向项目 server/uploads（请改成你的实际盘符路径）
  # location /uploads/ {
  #     alias E:/bill/server/uploads/;
  #     expires 30d;
  #     add_header Cache-Control "public";
  # }
}
