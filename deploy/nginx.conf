# 记账系统 Nginx 配置（Windows 版）
#
# 适用目录结构（与官方 Windows 包一致）：
#   nginx/
#   ├── conf/nginx.conf    ← 在 http {} 内增加：include bill.conf;
#   ├── html/
#   │   └── bill/
#   │       ├── pc/        ← frontend/dist 内容
#   │       └── mobile/    ← mobile/dist 内容
#   ├── logs/
#   └── nginx.exe
#
# 使用方式：
#   1. 将本文件复制到 nginx/conf/bill.conf
#   2. 编辑 conf/nginx.conf，在 http { } 末尾添加：include bill.conf;
#   3. 在 nginx 安装目录执行：nginx.exe -t && nginx.exe -s reload

upstream bill_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     ../ssl/localhost.pem;
    ssl_certificate_key ../ssl/localhost.key;

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 200m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1k;

   
    # PC 端
    location /pc/ {
        alias html/bill/pc/;
        try_files $uri $uri/ /pc/index.html;
    }

    location = /pc {
        return 301 /pc/;
    }

    # 移动端 H5
    location /mobile/ {
        alias html/bill/mobile/;
        try_files $uri $uri/ /mobile/index.html;
    }

    location = /mobile {
        return 301 /mobile/;
    }

    # 后端 API（前端 VITE_BASEURL="" 时走同源 /api）
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://bill_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 批量解析可能较慢，与 Node REQUEST_TIMEOUT 对齐为 5 分钟
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
